seed: 42

data:
  root: data/cifake
  image_size: 32
  validation_fraction: 0.1
  num_workers: 2
  augmentation: true

training:
  output_dir: runs/cifake_hybrid
  epochs: 20
  batch_size: 64
  learning_rate: 0.0001
  weight_decay: 0.0001
  patience: 5

model:
  type: hybrid
  num_classes: 2
  cnn_channels: [32, 64, 128]
  embedding_dim: 128
  transformer_layers: 2
  attention_heads: 4
  mlp_ratio: 2
  dropout: 0.2
