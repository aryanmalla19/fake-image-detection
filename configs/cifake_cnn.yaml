seed: 42

data:
  root: data/cifake
  image_size: 32
  validation_fraction: 0.1
  num_workers: 2
  augmentation: true

training:
  output_dir: runs/cifake_cnn
  epochs: 20
  batch_size: 64
  learning_rate: 0.0001
  weight_decay: 0.0001
  patience: 5

model:
  type: cnn
  num_classes: 2
  cnn_channels: [32, 64, 128]
  dropout: 0.2
